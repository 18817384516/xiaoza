name: Check source and modeling

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend without optional Blender (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python tools/package_open_source.py

  windows:
    name: Build and Blender browser integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare Python environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
      - name: Install verified official Blender
        run: .\.venv\Scripts\python.exe tools/prepare_blender.py
      - run: npm ci
      - run: npm run build
      - run: .\.venv\Scripts\python.exe -m pytest -q
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Preserve browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-windows
          path: |
            playwright-report/
            test-results/
          retention-days: 7
